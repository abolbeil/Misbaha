name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs can only read the repository unless they ask for more.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MISBAHA_NO_INPUT: "1"
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install (hash-locked)
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Lint
        run: |
          python -m pip install pyflakes
          python -m pyflakes misbaha tests Misbaha.pyw

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Build single exe
        shell: cmd
        run: build_exe.bat

      # Optional code signing (audit SEC-02). Dormant until the repository variable
      # SIGNING_ENABLED is "true" - see docs/SIGNING.md for the one-time setup.
      - name: Sign exe (Azure Artifact Signing)
        if: vars.SIGNING_ENABLED == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash dist/Misbaha.exe -Algorithm SHA256).Hash + "  Misbaha.exe" | Out-File -Encoding ascii dist/Misbaha.exe.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Misbaha
          path: |
            dist/Misbaha.exe
            dist/Misbaha.exe.sha256

  release:
    # Only version tags publish, and only this job may write to the repository.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Misbaha
          path: dist

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/Misbaha.exe
            dist/Misbaha.exe.sha256
          generate_release_notes: true
