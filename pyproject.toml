[project]
name = "misbaha"
dynamic = ["version"]
description = "Hands-free, always-on-top dhikr counter for Windows (mouse side buttons and shortcuts)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["PySide6-Essentials>=6.5,<7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Arabic",
    "Natural Language :: English",
]

[project.gui-scripts]
misbaha = "misbaha.app:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["misbaha"]

[tool.setuptools.dynamic]
version = { attr = "misbaha.__version__" }

[tool.setuptools.package-data]
misbaha = ["fonts/*"]
